<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PHC Cleaning Services | We Clean, You Relax</title>
<style>
:root{--g1:#0f4a22;--g2:#2f7d32;--g3:#6aa84f;--bg:#f3f8f1;--card:#fff;--text:#16301d;--muted:#5b6f60;--line:#d5e3d2;--wa:#25d366;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1a11;--card:#15261a;--text:#e8f3e8;--muted:#9db5a1;--line:#2a4430}}
:root[data-theme="dark"]{--bg:#0d1a11;--card:#15261a;--text:#e8f3e8;--muted:#9db5a1;--line:#2a4430}
*{box-sizing:border-box;margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
.hero{background:linear-gradient(160deg,var(--g1),var(--g2) 70%,var(--g3));color:#fff;text-align:center;padding:40px 20px 90px}
.logo{width:150px;height:150px;border-radius:50%;object-fit:cover;border:5px solid #fff;box-shadow:0 8px 30px rgba(0,0,0,.3);background:#fff}
h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(28px,7vw,44px);margin-top:18px;letter-spacing:.5px}
.tag{font-style:italic;opacity:.92;margin-top:4px;font-size:18px}
.phone{display:inline-block;margin-top:22px;font-size:clamp(26px,7vw,38px);font-weight:800;color:#fff;text-decoration:none;letter-spacing:.5px}
.btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 28px;border-radius:50px;font-size:17px;font-weight:700;text-decoration:none;border:0;cursor:pointer;min-width:160px;transition:transform .15s}
.btn:hover{transform:translateY(-2px)}
.call{background:#fff;color:var(--g1)}
.wa{background:var(--wa);color:#073b1a}
main{max-width:620px;margin:-60px auto 0;padding:0 16px 40px}
.card{background:var(--card);border-radius:20px;padding:28px 22px;box-shadow:0 10px 35px rgba(15,74,34,.15);border:1px solid var(--line)}
.card h2{font-family:Georgia,serif;font-size:26px;color:var(--g2);text-align:center}
.card p.sub{text-align:center;color:var(--muted);margin:6px 0 20px}
label{display:block;font-weight:600;font-size:14px;margin:14px 0 6px}
input,select,textarea{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;font:inherit;font-size:16px;background:var(--bg);color:var(--text)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--g2);box-shadow:0 0 0 3px rgba(47,125,50,.2)}
textarea{min-height:120px;resize:vertical}
.submit{width:100%;margin-top:22px;background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;padding:16px}
.note{text-align:center;color:var(--muted);font-size:13px;margin-top:12px}
footer{text-align:center;color:var(--muted);font-size:13px;padding:0 16px 28px}
</style>
</head>
